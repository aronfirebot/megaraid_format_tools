name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    
    - name: Build tools
      run: |
        gcc -O2 -Wall -Wextra -o mega_inquiry mega_inquiry.c
        gcc -O2 -Wall -Wextra -o mega_format512 mega_format512.c
        gcc -O2 -Wall -Wextra -o mega_modesel mega_modesel.c
        gcc -O2 -Wall -Wextra -o mega_format_immed mega_format_immed.c
        gcc -O2 -Wall -Wextra -o mega_progress mega_progress.c
        gcc -O2 -Wall -Wextra -o check_size check_size.c

    - name: Build unified multicall binary
      run: |
        gcc -O2 -Wall -Wextra -DMEGA_MULTICALL -o megaraid_tool \
          megaraid_tool.c mega_inquiry.c mega_format512.c mega_modesel.c \
          mega_format_immed.c mega_progress.c check_size.c

    - name: Test binaries exist
      run: |
        ls -lh mega_inquiry mega_format512 mega_modesel mega_format_immed mega_progress check_size megaraid_tool

    - name: Smoke test
      run: |
        # Every tool prints usage and exits 1 with no args, before opening any
        # device, so this is safe on a runner with no MegaRAID controller. It
        # catches link failures and startup crashes that `ls` cannot.
        for t in mega_inquiry mega_format512 mega_modesel mega_format_immed mega_progress; do
          # `&& rc=0 || rc=$?` captures the tool's own status without tripping
          # `set -e`, which a bare failing assignment would.
          out=$(./"$t" 2>&1) && rc=0 || rc=$?
          # Require exactly 1, not merely non-zero: a startup segfault exits 139
          # and would otherwise pass as if it were the usage path.
          if [ "$rc" -ne 1 ]; then
            echo "FAIL: $t exited $rc with no arguments, expected 1"; exit 1
          fi
          printf '%s\n' "$out" | grep -q 'Usage:' || {
            echo "FAIL: $t printed no usage text"; exit 1
          }
        done
        # check_size carries _Static_assert on the ioctl struct layout, so a
        # mismatch already fails the build; run it so the numbers are in the log.
        ./check_size

    - name: Smoke test unified binary
      run: |
        # Same idea as the standalone smoke test above, but through the
        # subcommand dispatcher, plus the busybox-style progname dispatch
        # (invoking it via a symlink named after the original tool).
        for cmd in inquiry format512 modesel format_immed progress; do
          out=$(./megaraid_tool "$cmd" 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "FAIL: megaraid_tool $cmd exited $rc with no arguments, expected 1"; exit 1
          fi
          printf '%s\n' "$out" | grep -q 'Usage:' || {
            echo "FAIL: megaraid_tool $cmd printed no usage text"; exit 1
          }
        done
        ./megaraid_tool check_size
        # Progname dispatch: a copy named after an original tool should
        # behave like that tool with no "<command>" argument needed.
        mkdir -p /tmp/multicall_check
        cp megaraid_tool /tmp/multicall_check/mega_inquiry
        out=$(/tmp/multicall_check/mega_inquiry 2>&1) && rc=0 || rc=$?
        if [ "$rc" -ne 1 ] || ! printf '%s\n' "$out" | grep -q 'Usage:'; then
          echo "FAIL: progname dispatch via a mega_-prefixed binary name did not work"; exit 1
        fi
        rm -rf /tmp/multicall_check

    - name: Sense parser tests
      run: sh run_tests.sh

    # The ioctl structs and shared helpers (send_cmd, parse_target,
    # print_ascii, ...) used to be copied into every mega_*.c file, so CI
    # hashed each copy here to catch silent drift between them. They now
    # live once in megaraid_common.h, which every tool includes - there is
    # only one copy, so cross-tool drift is no longer a class of bug that can
    # occur, and check_size.c's _Static_assert still catches a struct-layout
    # mismatch at compile time.

    - name: Create build artifacts archive
      run: |
        tar -czf megaraid-tools-linux-x86_64.tar.gz mega_inquiry mega_format512 mega_modesel mega_format_immed mega_progress check_size megaraid_tool README.md LICENSE

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: megaraid-tools-linux-x86_64
        path: |
          mega_inquiry
          mega_format512
          mega_modesel
          mega_format_immed
          mega_progress
          check_size
          megaraid_tool
          megaraid-tools-linux-x86_64.tar.gz
    
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: megaraid-tools-linux-x86_64
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          megaraid-tools-linux-x86_64.tar.gz
          mega_inquiry
          mega_format512
          mega_modesel
          mega_format_immed
          mega_progress
          check_size
          megaraid_tool
        body: |
          ## MegaRAID Format Tools Release

          Pre-compiled binaries for Linux x86_64.

          ### Tools Included:
          - `mega_inquiry` - Drive identification tool
          - `mega_format512` - FORMAT UNIT tool
          - `mega_modesel` - MODE SELECT + FORMAT tool
          - `mega_format_immed` - MODE SELECT + FORMAT UNIT with IMMED (background format; reliable on slow HDDs)
          - `mega_progress` - Poll background FORMAT UNIT progress
          - `check_size` - Structure validation tool
          - `megaraid_tool` - all of the above in one binary, as subcommands
            (`megaraid_tool inquiry ...`, `megaraid_tool progress ...`, etc.)

          ### Usage:
          Download the individual tools, `megaraid_tool`, or the tar.gz archive
          containing all of them.
          Make the tools executable: `chmod +x mega_inquiry mega_format512 mega_modesel mega_format_immed mega_progress check_size megaraid_tool`
          
          See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for detailed usage instructions.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
